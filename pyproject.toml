[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-intelligence"
version = "0.1.0"
description = "Plataforma educacional de análise e previsão de risco de crédito"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "streamlit==1.40.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
